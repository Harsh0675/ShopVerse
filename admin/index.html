<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopVerse Admin v6</title>
<style>body{font-family:system-ui;margin:0;background:#f6f6fb;color:#15151d}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 6px 24px #0001}.num{font-size:28px;font-weight:800}.ok{font-weight:800}.bar{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 16px;cursor:pointer}</style></head>
<body><main><h1>ShopVerse Admin</h1><p>Catalog • Orders • Customers • Coupons • AI • Operations</p><div class="grid">
<div class="card">API status<div class="num" id="status">—</div></div>
<div class="card">Products<div class="num" id="products">—</div></div>
<div class="card">Categories<div class="num" id="categories">—</div></div>
<div class="card">AI service<div class="num" id="ai">READY</div></div></div><br>
<div class="bar"><button onclick="load()">Refresh</button><button onclick="window.open('../backend/db/schema.sql')">Schema</button></div>
<h2>Operations</h2><div class="card"><p>Use authenticated API clients for customer/order mutations. This dashboard is intentionally credential-free and safe to extend with an admin auth flow.</p></div>
<script>const API='http://localhost:4000/api';async function load(){try{let h=await fetch(API+'/health').then(r=>r.json());let p=await fetch(API+'/products').then(r=>r.json());let c=await fetch(API+'/categories').then(r=>r.json());status.textContent=h.ok?'ONLINE':'ERROR';products.textContent=p.length;categories.textContent=c.length}catch(e){status.textContent='OFFLINE'}}load()</script></main></body></html>
