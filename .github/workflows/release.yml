name: ShopVerse Multi-Platform Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter create --platforms=android,ios,windows,linux,macos .
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package Android release
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/ShopVerse-${GITHUB_REF_NAME}-android.apk
          cp build/app/outputs/bundle/release/app-release.aab release/ShopVerse-${GITHUB_REF_NAME}-android.aab
          sha256sum release/* > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: mobile/release/*

  ios:
    runs-on: macos-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter create --platforms=android,ios,windows,linux,macos .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${API_BASE_URL}
      - run: |
          cd build/ios/iphoneos
          zip -r ../../ShopVerse-${GITHUB_REF_NAME}-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned
          path: mobile/build/ShopVerse-${GITHUB_REF_NAME}-ios-unsigned.zip

  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: windows-release
          - os: ubuntu-latest
            target: linux
            artifact: linux-release
          - os: macos-latest
            target: macos
            artifact: macos-release
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter create --platforms=android,ios,windows,linux,macos .
      - run: flutter config --enable-${{ matrix.target }}-desktop
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package Windows release
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $source = "build\windows\x64\runner\Release"
          $package = "build\ShopVerse-$env:GITHUB_REF_NAME-windows"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "$source\*" $package -Recurse -Force
          Compress-Archive -Path "$package\*" -DestinationPath "build\ShopVerse-$env:GITHUB_REF_NAME-windows.zip" -Force
          Get-FileHash "build\ShopVerse-$env:GITHUB_REF_NAME-windows.zip" -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            mobile/build/${{ matrix.target }}/**/*
            mobile/build/ShopVerse-${{ github.ref_name }}-windows.zip

  release:
    needs: [android, ios, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release-assets}
      - name: Create release package index
        run: |
          printf '%s\n' "# ShopVerse ${GITHUB_REF_NAME}" "" "Android APK and AAB, iOS unsigned archive, Windows ZIP package, and Linux/macOS builds are included." > release-assets/RELEASE-CONTENTS.md
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**
