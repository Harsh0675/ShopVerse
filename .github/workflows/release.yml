name: ShopVerse Multi-Platform Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package Android
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/ShopVerse-${GITHUB_REF_NAME}-android.apk
          cp build/app/outputs/bundle/release/app-release.aab release/ShopVerse-${GITHUB_REF_NAME}-android.aab
          sha256sum release/* > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: android-release, path: mobile/release/*}

  ios:
    runs-on: macos-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - name: Build unsigned iOS frameworks
        run: flutter build ios-framework --release --no-profile --no-debug --output=build/ios-framework --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package iOS framework
        run: |
          cd build/ios-framework
          zip -r ../../ShopVerse-${GITHUB_REF_NAME}-ios-frameworks.zip .
      - uses: actions/upload-artifact@v4
        with: {name: ios-framework-release, path: mobile/ShopVerse-${{ github.ref_name }}-ios-frameworks.zip}

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            archive: zip
          - os: ubuntu-latest
            target: linux
            archive: tar.gz
          - os: macos-latest
            target: macos
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter config --enable-${{ matrix.target }}-desktop
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "ShopVerse-${env:GITHUB_REF_NAME}-windows.zip" -Force
      - name: Package Linux
        if: matrix.target == 'linux'
        run: tar -czf ShopVerse-${GITHUB_REF_NAME}-linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Package macOS
        if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/ShopVerse.app ShopVerse-${GITHUB_REF_NAME}-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release
          path: mobile/ShopVerse-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    needs: [android, ios, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release-assets}
      - name: Flatten release assets
        run: |
          mkdir -p dist
          find release-assets -type f -maxdepth 3 -exec cp {} dist/ \;
          printf '%s\n' "# ShopVerse ${GITHUB_REF_NAME}" "" "Multiplatform release: Android APK/AAB, iOS frameworks, Windows, Linux, and macOS packages." > dist/RELEASE-CONTENTS.md
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
