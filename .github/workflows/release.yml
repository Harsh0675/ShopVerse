name: ShopVerse Multi-Platform Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  RELEASE_VERSION: v8.0.0

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package Android
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/ShopVerse-${RELEASE_VERSION}-android.apk
          cp build/app/outputs/bundle/release/app-release.aab release/ShopVerse-${RELEASE_VERSION}-android.aab
          sha256sum release/* > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: android-release, path: mobile/release/*}

  ios:
    runs-on: macos-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - name: Build unsigned iOS frameworks
        run: flutter build ios-framework --release --output=build/ios-framework --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package iOS framework
        run: |
          cd build/ios-framework
          zip -r ../../ShopVerse-${RELEASE_VERSION}-ios-frameworks.zip .
      - uses: actions/upload-artifact@v4
        with: {name: ios-release, path: mobile/ShopVerse-${{ env.RELEASE_VERSION }}-ios-frameworks.zip}

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter config --enable-${{ matrix.target }}-desktop
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "ShopVerse-${env:RELEASE_VERSION}-windows.zip" -Force
      - name: Package Linux
        if: matrix.target == 'linux'
        run: tar -czf ShopVerse-${RELEASE_VERSION}-linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Package macOS
        if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/ShopVerse.app ShopVerse-${RELEASE_VERSION}-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release
          path: mobile/ShopVerse-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.*

  release:
    needs: [android, ios, desktop]
    if: ${{ needs.android.result == 'success' && needs.ios.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release-assets}
      - name: Collect release files
        run: |
          mkdir -p dist
          find release-assets -type f -maxdepth 3 -exec cp {} dist/ \;
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: ShopVerse ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: dist/*
