name: ShopVerse Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: v8.0.0
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package Android
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/ShopVerse-${RELEASE_VERSION}-android.apk
          cp build/app/outputs/bundle/release/app-release.aab release/ShopVerse-${RELEASE_VERSION}-android.aab
          sha256sum release/* > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/release

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build unsigned iOS frameworks
        run: flutter build ios-framework --release --output=build/ios-framework --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package iOS
        run: |
          cd build/ios-framework
          zip -r ../../ShopVerse-${RELEASE_VERSION}-ios-frameworks.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/ShopVerse-${{ env.RELEASE_VERSION }}-ios-frameworks.zip

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package Linux
        run: tar -czf ShopVerse-${RELEASE_VERSION}-linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: mobile/ShopVerse-${{ env.RELEASE_VERSION }}-linux.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "ShopVerse-${env:RELEASE_VERSION}-windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: mobile/ShopVerse-${{ env.RELEASE_VERSION }}-windows.zip

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - name: Package macOS
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/ShopVerse.app ShopVerse-${RELEASE_VERSION}-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: mobile/ShopVerse-${{ env.RELEASE_VERSION }}-macos.zip

  release:
    needs:
      - android
      - ios
      - linux
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Collect assets
        run: |
          mkdir -p dist
          find assets -type f -exec cp {} dist/ \;
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: ShopVerse ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: dist/*
